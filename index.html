/* ---------------------------------------------------------
   Simple hash-based router (no build step, no react-router)
   Routes may carry an id segment, e.g. #/worker-profile/priya-kaur
--------------------------------------------------------- */
function useHashRoute() {
  const getRoute = () => window.location.hash.replace('#', '') || '/';
  const [route, setRoute] = useState(getRoute());

  useEffect(() => {
    const onHashChange = () => setRoute(getRoute());
    window.addEventListener('hashchange', onHashChange);
    return () => window.removeEventListener('hashchange', onHashChange);
  }, []);

  return route;
}

function navigate(path) {
  window.location.hash = path;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function parseRoute(route) {
  const segments = route.split('/').filter(Boolean);
  const base = segments.length === 0 ? '/' : '/' + segments[0];
  const id = segments[1];
  return { base, id };
}

/* ---------------------------------------------------------
   Role context — persisted to localStorage so the chosen
   role (Landowner / Worker) survives across navigation
--------------------------------------------------------- */
const RoleContext = createContext({ role: null, setRole: () => {} });

const ROLE_STORAGE_KEY = 'agrolink_role';

function readStoredRole() {
  try {
    const stored = localStorage.getItem(ROLE_STORAGE_KEY);
    return stored === 'landowner' || stored === 'worker' ? stored : null;
  } catch (e) {
    return null;
  }
}

function writeStoredRole(role) {
  try {
    if (role) localStorage.setItem(ROLE_STORAGE_KEY, role);
    else localStorage.removeItem(ROLE_STORAGE_KEY);
  } catch (e) {
    /* localStorage unavailable — role still works for this session via state */
  }
}

function NavBar({ route }) {
  const { role, setRole } = useContext(RoleContext);
  const [mobileOpen, setMobileOpen] = useState(false);
  const { base } = parseRoute(route);

  const listingsLabel = role === 'landowner' ? 'Available Workers' : 'Available Farm Opportunities';
  const roleLabel = role === 'landowner' ? 'Welcome, Landowner' : role === 'worker' ? 'Welcome, Worker' : null;
  const profileInitials = role === 'landowner' ? 'GV' : role === 'worker' ? 'AS' : null;

  const links = role
    ? [
        { path: '/', label: 'Home' },
        { path: '/listings', label: listingsLabel },
        { path: '/messaging', label: 'Messaging' },
      ]
    : [{ path: '/', label: 'Home' }];

  const goOwnProfile = () => {
    if (role === 'landowner') navigate(`/landowner-profile/${SELF_FARM_ID}`);
    else if (role === 'worker') navigate(`/worker-profile/${SELF_WORKER_ID}`);
    setMobileOpen(false);
  };

  const switchRole = () => {
    setRole(null);
    navigate('/');
    setMobileOpen(false);
  };

  return (
    <header className="bg-white shadow-sm sticky top-0 z-50">
      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div className="flex items-center justify-between h-16">
          <a href="#/" className="flex items-center gap-2 flex-shrink-0">
            <img src="assets/agrolink-icon.png" alt="" className="h-9 w-9" />
            <span className="text-2xl font-extrabold tracking-tight" style={{ color: '#1A6B3A' }}>
              AgroLink <span className="text-navy">UK</span>
            </span>
          </a>

          <nav className="hidden md:flex items-center gap-1">
            {links.map((link) => {
              const active = base === link.path;
              return (
                <a
                  key={link.path}
                  href={`#${link.path}`}
                  className={
                    "px-3 py-2 rounded-md text-sm font-medium transition-colors whitespace-nowrap " +
                    (active
                      ? "bg-primary-light text-primary"
                      : "text-gray-600 hover:text-primary hover:bg-primary-light")
                  }
                >
                  {link.label}
                </a>
              );
            })}

            {role && (
              <div className="flex items-center gap-3 ml-3 pl-3 border-l border-gray-200">
                <span className="text-xs font-semibold text-navy bg-navy-light px-3 py-1.5 rounded-full whitespace-nowrap">
                  {roleLabel}
                </span>
                <button
                  onClick={goOwnProfile}
                  title="My Profile"
                  className="w-9 h-9 rounded-full bg-navy text-white flex items-center justify-center text-xs font-bold hover:bg-navy-dark transition-colors flex-shrink-0"
                >
                  {profileInitials}
                </button>
                <button
                  onClick={switchRole}
                  className="text-xs font-medium text-gray-500 hover:text-primary underline whitespace-nowrap"
                >
                  Switch Role
                </button>
              </div>
            )}
          </nav>

          <button
            className="md:hidden p-2 rounded-md text-gray-600 hover:bg-gray-100"
            onClick={() => setMobileOpen(!mobileOpen)}
            aria-label="Toggle navigation menu"
          >
            <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              {mobileOpen ? (
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
              ) : (
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
              )}
            </svg>
          </button>
        </div>

        {mobileOpen && (
          <nav className="md:hidden pb-4 flex flex-col gap-1">
            {links.map((link) => {
              const active = base === link.path;
              return (
                <a
                  key={link.path}
                  href={`#${link.path}`}
                  onClick={() => setMobileOpen(false)}
                  className={
                    "px-3 py-2 rounded-md text-sm font-medium transition-colors " +
                    (active
                      ? "bg-primary-light text-primary"
                      : "text-gray-600 hover:text-primary hover:bg-primary-light")
                  }
                >
                  {link.label}
                </a>
              );
            })}

            {role && (
              <div className="flex flex-col gap-2 mt-2 pt-3 border-t border-gray-100">
                <span className="text-xs font-semibold text-navy bg-navy-light px-3 py-1.5 rounded-full w-fit">

                >
                  <span className="w-6 h-6 rounded-full bg-navy text-white flex items-center justify-center text-[10px] font-bold">
                    {profileInitials}
                  </span>
                  My Profile
                </button>
                <button
                  onClick={switchRole}
                  className="text-xs font-medium text-gray-500 hover:text-primary underline text-left px-3"
                >
                  Switch Role
                </button>
              </div>
            )}
          </nav>
        )}
      </div>
    </header>
  );
}

          <div key={f.title} className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 text-center">
            <div className="w-14 h-14 rounded-full bg-primary-light text-primary flex items-center justify-center mx-auto mb-4">
              {f.icon}
            </div>
            <h3 className="font-semibold text-navy text-lg mb-2">{f.title}</h3>
            <p className="text-sm text-gray-600 leading-relaxed">{f.desc}</p>
          </div>
        ))}
      </section>
    </PageShell>
  );
}

/* ---------------------------------------------------------
   PAGE 2 — Worker Profile
   Shown to a landowner browsing a worker (Request to Hire +
   Send Message appear), or to a worker viewing their own
   profile via the nav profile icon (no action buttons).
--------------------------------------------------------- */
function WorkerProfilePage({ workerId }) {
  const { role } = useContext(RoleContext);
  const worker = WORKERS.find((w) => w.id === workerId) || WORKERS.find((w) => w.id === SELF_WORKER_ID);
  const showActions = role === 'landowner';
  const isOwn = role === 'worker' && worker.id === SELF_WORKER_ID;

  return (
    <PageShell>
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 sm:p-8 mb-6">
        <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
          <div className="flex items-center gap-4">
            <WorkerAvatar worker={worker} size="lg" />
            <div>
              <h1 className="text-2xl font-bold text-navy">{worker.name}</h1>
              <p className="text-gray-600">{worker.degree} — {worker.university}, {worker.gradYear}</p>
              <div className="mt-2 flex items-center gap-2 flex-wrap">
                <VerifiedBadge />
                {isOwn && (
                  <span className="text-xs text-gray-400 italic">This is your profile</span>
                )}
              </div>
            </div>
          </div>
          {showActions && (
            <div className="flex flex-col sm:flex-row gap-3">
              <PrimaryButton onClick={() => navigate('/messaging')}>Request to Hire</PrimaryButton>
              <SecondaryButton onClick={() => navigate('/messaging')}>Send Message</SecondaryButton>
            </div>
          )}
        </div>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
        <SectionCard title="Education">
          <p className="text-gray-700 font-medium">{worker.degree}</p>
          <p className="text-gray-600 text-sm">{worker.university} — Class of {worker.gradYear}</p>
        </SectionCard>

        <SectionCard title="Availability">
          <p className="text-gray-700 font-medium">{worker.availability}</p>
          <p className="text-gray-600 text-sm">Available for seasonal UK contracts</p>
        </SectionCard>

        <SectionCard title="Crop Experience">
          {worker.cropExperience.map((c) => <Pill key={c}>{c}</Pill>)}
        </SectionCard>

        <SectionCard title="Skills">
          {worker.skills.map((s) => <Pill key={s}>{s}</Pill>)}
        </SectionCard>

        <SectionCard title="English Proficiency" className="md:col-span-2">
          <p className="text-gray-700 font-medium">{worker.english}</p>
          <p className="text-gray-600 text-sm">{worker.englishDesc}</p>
        </SectionCard>
      </div>
    </PageShell>
  );
}

/* ---------------------------------------------------------
   PAGE 3 — Landowner Farm Profile
   Shown to a worker browsing a farm (Contact Farm appears),
   or to a landowner viewing their own farm via the nav
   profile icon (no Contact Farm button).
--------------------------------------------------------- */
function LandownerProfilePage({ farmId }) {
  const { role } = useContext(RoleContext);
  const farm = FARMS.find((f) => f.id === farmId) || FARMS.find((f) => f.id === SELF_FARM_ID);
  const showContact = role === 'worker';
  const isOwn = role === 'landowner' && farm.id === SELF_FARM_ID;

  return (
    <PageShell>
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-6">
        {farm.bannerUrl && (
          <img src={farm.bannerUrl} alt={farm.name} className="w-full h-[200px] object-cover" />
        )}
        <div className="p-6 sm:p-8">
          <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div className="flex items-center gap-4">
              <div className="w-16 h-16 rounded-full bg-primary text-white flex items-center justify-center text-2xl font-bold flex-shrink-0">
                {farm.initials}
              </div>
              <div>
                <h1 className="text-2xl font-bold text-navy">{farm.name}</h1>
                <p className="text-gray-600">{farm.location}</p>
                <div className="mt-2 flex items-center gap-2 flex-wrap">
                  <VerifiedBadge />
                  {isOwn && (
                    <span className="text-xs text-gray-400 italic">This is your profile</span>
                  )}
                </div>
              </div>
            </div>
            {showContact && <PrimaryButton onClick={() => navigate('/messaging')}>Contact Farm</PrimaryButton>}
          </div>
        </div>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
        <SectionCard title="Farm Details">
          <p className="text-gray-700 font-medium">{farm.acres} acres</p>
          <p className="text-gray-600 text-sm">Growing {farm.cropTypeSummary.toLowerCase()}</p>
        </SectionCard>

        <SectionCard title="Contract Duration">
          <p className="text-gray-700 font-medium">{farm.contractDuration}</p>
        </SectionCard>

        <SectionCard title="Crops Grown">
          {farm.cropsGrown.map((c) => <Pill key={c}>{c}</Pill>)}
        </SectionCard>

        <SectionCard title="Skills Required">
          {farm.skillsRequired.map((s) => <Pill key={s}>{s}</Pill>)}
        </SectionCard>

        <SectionCard title="Workers Needed">
          <p className="text-3xl font-bold text-primary">{farm.workersNeeded}</p>
        </SectionCard>

        <SectionCard title="Accommodation Available">
          <p className="text-gray-700 font-medium">
            {farm.accommodation ? 'Yes — on-site accommodation provided' : 'No'}
          </p>
        </SectionCard>
      </div>
    </PageShell>
  );
}

/* ---------------------------------------------------------
   PAGE 4 — Listings
   Landowner role -> "Available Workers" (browse WORKERS)
   Worker role    -> "Available Farm Opportunities" (browse FARMS)
--------------------------------------------------------- */
function WorkerListingCard({ worker }) {
  return (
    <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
      <div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4">
        <div className="flex gap-4">
          <WorkerAvatar worker={worker} size="sm" />
          <div>
            <h3 className="font-bold text-navy text-lg">{worker.name}</h3>
            <p className="text-sm text-gray-600">{worker.degree}, {worker.university} ({worker.gradYear})</p>
            <div className="mt-2">{worker.cropExperience.map((c) => <Pill key={c}>{c}</Pill>)}</div>
            <p className="text-sm text-gray-500 mt-1">Availability: {worker.availability}</p>
          </div>
        </div>
        <div className="w-full sm:w-40 flex-shrink-0">
          <MatchBar value={worker.match} />
        </div>
      </div>
      <div className="mt-4">
        <PrimaryButton onClick={() => navigate(`/worker-profile/${worker.id}`)} className="text-sm px-5 py-2.5">
          View Profile
        </PrimaryButton>
      </div>
    </div>
  );
}

function FarmListingCard({ farm }) {
  return (
    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
      {farm.bannerUrl && (
        <img src={farm.bannerUrl} alt={farm.name} className="w-full h-[120px] object-cover" />
      )}
      <div className="p-6">
        <div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4">
          <div className="flex gap-4">
            <div className="w-12 h-12 rounded-full bg-primary text-white flex items-center justify-center font-bold flex-shrink-0">
              {farm.initials}
            </div>
            <div>
              <h3 className="font-bold text-navy text-lg">{farm.name}</h3>
              <p className="text-sm text-gray-600">{farm.location}</p>
              <p className="text-sm text-gray-600 mt-1">Crop type: {farm.cropTypeSummary}</p>
              <p className="text-sm text-gray-500 mt-1">
                Workers needed: {farm.workersNeeded} &middot; Contract: {farm.contractDuration}
              </p>
            </div>
          </div>
          <div className="w-full sm:w-40 flex-shrink-0">
            <MatchBar value={farm.match} />
          </div>
        </div>
        <div className="mt-4">
          <PrimaryButton onClick={() => navigate(`/landowner-profile/${farm.id}`)} className="text-sm px-5 py-2.5">
            View Farm
          </PrimaryButton>
        </div>
      </div>
    </div>
  );
}

function ListingsPage() {
  const { role } = useContext(RoleContext);
  const isLandowner = role === 'landowner';
  const title = isLandowner ? 'Available Workers' : 'Available Farm Opportunities';

  return (
    <PageShell>
      <h1 className="text-2xl sm:text-3xl font-bold text-navy mb-8">{title}</h1>

      <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
        <FilterSidebar groups={isLandowner ? WORKER_FILTER_GROUPS : FARM_FILTER_GROUPS} />

        <div id="results" className="lg:col-span-3 flex flex-col gap-5">
          {isLandowner
            ? WORKERS.map((w) => <WorkerListingCard key={w.id} worker={w} />)
            : FARMS.map((f) => <FarmListingCard key={f.id} farm={f} />)}
        </div>
      </div>
    </PageShell>
  );
}

/* ---------------------------------------------------------
   PAGE 5 — In-Platform Messaging
   Bubble alignment and header flip depending on which role
   is the "current user" so the conversation always reads
   from that user's point of view.
--------------------------------------------------------- */
function MessageBubble({ text, time, mine }) {
  return (
    <div className={`flex ${mine ? 'justify-end' : 'justify-start'}`}>
      <div className={`max-w-[80%] sm:max-w-[65%] rounded-2xl px-4 py-3 ${
        mine ? 'bg-primary text-white rounded-tr-sm' : 'bg-white border border-gray-100 text-gray-700 rounded-tl-sm'
      }`}>
        <p className="text-sm leading-relaxed">{text}</p>
        <p className={`text-[11px] mt-1.5 ${mine ? 'text-primary-light' : 'text-gray-400'}`}>{time}</p>
      </div>
    </div>
  );
}

function MessagingPage() {
  const { role } = useContext(RoleContext);
  const [uploaded, setUploaded] = useState(false);
  const isLandowner = role === 'landowner';
  const messages = isLandowner ? LANDOWNER_INITIATED_MESSAGES : WORKER_INITIATED_MESSAGES;

  const selfLabel = isLandowner ? 'Green Valley Farm' : 'Arjun Singh';
  const counterpartLabel = isLandowner ? 'Arjun Singh' : 'Green Valley Farm';
  const selfInitials = isLandowner ? 'GV' : 'AS';
  const counterpartInitials = isLandowner ? 'AS' : 'GV';
  const leftAvatarClasses = isLandowner ? 'bg-primary text-white' : 'bg-white text-navy';
  const rightAvatarClasses = isLandowner ? 'bg-white text-navy' : 'bg-primary text-white';

  return (
    <PageShell>
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        {/* Conversation header */}
        <div className="flex items-center justify-between px-6 py-4 border-b border-gray-100 bg-navy text-white">
          <div className="flex items-center gap-3">
            <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold ${leftAvatarClasses}`}>
              {selfInitials}
            </div>
            <div>
              <p className="font-semibold leading-tight">{selfLabel}</p>
              <p className="text-xs text-navy-light opacity-80">Conversation with {counterpartLabel}</p>
            </div>
          </div>
          <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold ${rightAvatarClasses}`}>
            {counterpartInitials}
          </div>
        </div>

        {/* Messages */}
        <div className="p-6 flex flex-col gap-4 bg-lightgrey">
          {messages.map((m, i) => (
            <MessageBubble
              key={i}
              text={m.text}
              time={m.time}
              mine={isLandowner ? m.from === 'farm' : m.from === 'worker'}
            />
          ))}
        </div>

        {/* Message input (visual only) */}
        <div className="flex items-center gap-3 px-6 py-4 border-t border-gray-100">
          <input
            type="text"
            disabled
            placeholder="Type a message..."
            className="flex-1 border border-gray-200 rounded-full px-4 py-2.5 text-sm bg-gray-50 text-gray-400"
          />
          <PrimaryButton className="text-sm px-5 py-2.5">Send</PrimaryButton>
        </div>
      </div>

      {/* Contract Documents */}
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mt-6">
        <h3 className="text-navy font-semibold text-lg mb-4">Contract Documents</h3>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div className="border border-dashed border-gray-300 rounded-lg p-5 text-center">
            <p className="text-sm text-gray-500 mb-3">Landowner — Green Valley Farm</p>
            <PrimaryButton onClick={() => setUploaded(true)} className="w-full">
              Upload Contract
            </PrimaryButton>
            {uploaded && (
              <p className="text-xs text-primary mt-2 font-medium">seasonal_contract_2026.pdf uploaded</p>
            )}
          </div>
          <div className="border border-dashed border-gray-300 rounded-lg p-5 text-center">
            <p className="text-sm text-gray-500 mb-3">Worker — Arjun Singh</p>
            <SecondaryButton className="w-full">Download and Sign</SecondaryButton>
          </div>
        </div>

        <div className="flex items-start gap-2 mt-5 bg-primary-light rounded-lg px-4 py-3">
          <svg className="w-4 h-4 text-primary flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          <p className="text-xs text-primary-dark leading-relaxed">
            Contact details are protected — all communication stays on-platform.
          </p>
        </div>
      </div>
    </PageShell>
  );
}

/* ---------------------------------------------------------
   App root
--------------------------------------------------------- */
function App() {
  const route = useHashRoute();
  const [role, setRoleState] = useState(readStoredRole);

  const setRole = (r) => {
    setRoleState(r);
    writeStoredRole(r);
  };

  const { base, id } = parseRoute(route);

  // Guard: pages other than Landing require a role to be selected.
  useEffect(() => {
    if (!role && base !== '/') {
      navigate('/');
    }
  }, [role, base]);

  let content;
  if (!role && base !== '/') {
    content = null;
  } else {
    switch (base) {
      case '/listings':
        content = <ListingsPage />;
        break;
      case '/worker-profile':
        content = <WorkerProfilePage workerId={id || SELF_WORKER_ID} />;
        break;
      case '/landowner-profile':
        content = <LandownerProfilePage farmId={id || SELF_FARM_ID} />;
        break;
      case '/messaging':
        content = <MessagingPage />;
        break;
      default:
        content = <LandingPage />;
    }
  }

  return (
    <RoleContext.Provider value={{ role, setRole }}>
      <div className="min-h-screen flex flex-col">
        <NavBar route={route} />
        {content}
        <Footer />
      </div>
    </RoleContext.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
